<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    AFRAME.registerShader('chromakey', {
      schema: {
        src: {type: 'map', is: 'uniform'},
        color: {type: 'color', is: 'uniform', default: '#00FF00'},
        threshold: {type: 'number', is: 'uniform', default: 0.5},
        smoothing: {type: 'number', is: 'uniform', default: 0.2},
        spill: {type: 'number', is: 'uniform', default: 0.5}
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D src;
        uniform vec3 color;
        uniform float threshold;
        uniform float smoothing;
        uniform float spill;
        varying vec2 vUv;
        void main() {
          vec4 texColor = texture2D(src, vUv);
          float diff = length(texColor.rgb - color);
          float alpha = smoothstep(threshold, threshold + smoothing, diff);
          // yeşil sızıntısını (spill) bastır: yeşil kanalı fazla baskınsa kırp
          float greenExcess = max(texColor.g - max(texColor.r, texColor.b), 0.0);
          vec3 despilled = texColor.rgb - vec3(0.0, greenExcess * spill, 0.0);
          gl_FragColor = vec4(despilled, alpha);
        }
      `
    });

    AFRAME.registerComponent('smooth-anchor', {
      schema: {speed: {type: 'number', default: 0.15}},
      init: function () {
        this.lastPos = new THREE.Vector3();
        this.lastQuat = new THREE.Quaternion();
        this.ready = false;
      },
      tick: function () {
        const obj = this.el.object3D;
        if (!this.ready) {
          this.lastPos.copy(obj.position);
          this.lastQuat.copy(obj.quaternion);
          this.ready = true;
          return;
        }
        this.lastPos.lerp(obj.position, this.data.speed);
        this.lastQuat.slerp(obj.quaternion, this.data.speed);
        obj.position.copy(this.lastPos);
        obj.quaternion.copy(this.lastQuat);
      }
    });

    AFRAME.registerComponent('persist-visibility', {
      schema: {holdFrames: {type: 'number', default: 30}},
      init: function () { this.hiddenCounter = 0; },
      tick: function () {
        const visible = this.el.object3D.visible;
        if (!visible) {
          this.hiddenCounter++;
          if (this.hiddenCounter < this.data.holdFrames) this.el.object3D.visible = true;
        } else {
          this.hiddenCounter = 0;
        }
      }
    });
  </script>
</head>
<body style="margin:0; overflow:hidden;">

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.00001; filterBeta: 1; missTolerance:20; warmupTolerance:3; uiScanning: no; uiLoading: no; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-assets>
      <video id="personVideo" src="./person.mp4" autoplay loop muted playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" smooth-anchor="speed: 0.15" persist-visibility="holdFrames: 30">
      <a-plane
        id="figurePlane"
        material="shader: chromakey; src: #personVideo; transparent: true; side: double; threshold: 0.5; smoothing: 0.2; spill: 0.5"
        position="0 0 0"
        rotation="0 0 0"
        width="0.45"
        height="0.65"
      ></a-plane>
    </a-entity>

  </a-scene>

  <!-- CANLI AYAR PANELİ -->
  <div id="controlPanel" style="position:fixed; bottom:0; left:0; right:0; background:rgba(0,0,0,0.75); color:white; font-family:sans-serif; font-size:14px; padding:10px; z-index:999;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span>X: <span id="xVal">0</span></span>
      <input type="range" id="xSlider" min="-1" max="1" step="0.01" value="0" style="flex:1; margin:0 10px;">
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span>Y: <span id="yVal">0</span></span>
      <input type="range" id="ySlider" min="-1" max="1" step="0.01" value="0" style="flex:1; margin:0 10px;">
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span>Boyut: <span id="sVal">0.45</span></span>
      <input type="range" id="sSlider" min="0.1" max="1.5" step="0.01" value="0.45" style="flex:1; margin:0 10px;">
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span>Dönüş: <span id="rVal">0</span></span>
      <input type="range" id="rSlider" min="-45" max="45" step="1" value="0" style="flex:1; margin:0 10px;">
    </div>
    <button id="printBtn" style="width:100%; margin-top:8px; padding:8px; background:#2a7; color:white; border:none; border-radius:4px;">Değerleri Göster</button>
    <div id="output" style="margin-top:6px; font-size:12px; word-break:break-all;"></div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const plane = document.querySelector('#figurePlane');
      const xS = document.querySelector('#xSlider');
      const yS = document.querySelector('#ySlider');
      const sS = document.querySelector('#sSlider');
      const rS = document.querySelector('#rSlider');

      function update() {
        const x = parseFloat(xS.value);
        const y = parseFloat(yS.value);
        const s = parseFloat(sS.value);
        const r = parseFloat(rS.value);
        document.querySelector('#xVal').textContent = x;
        document.querySelector('#yVal').textContent = y;
        document.querySelector('#sVal').textContent = s;
        document.querySelector('#rVal').textContent = r;
        plane.setAttribute('position', `${x} ${y} 0`);
        plane.setAttribute('width', s);
        plane.setAttribute('height', s * 1.44);
        plane.setAttribute('rotation', `0 0 ${r}`);
      }

      [xS, yS, sS, rS].forEach(el => el.addEventListener('input', update));

      document.querySelector('#printBtn').addEventListener('click', () => {
        document.querySelector('#output').textContent =
          `position="${xS.value} ${yS.value} 0" width="${sS.value}" height="${(sS.value*1.44).toFixed(2)}" rotation="0 0 ${rS.value}"`;
      });
    });
  </script>

</body>
</html>
