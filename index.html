<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Balkon AR</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    .ui-overlay {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.55); color: #fff; padding: 10px;
      font-size: 13px; z-index: 999; display: none;
    }
    .ui-overlay.show { display: block; }
    .ui-overlay label { display:inline-block; width: 70px; }
    .ui-overlay input[type=range] { width: 55%; vertical-align: middle; }
    .ui-overlay .row { margin-bottom: 4px; }
    #toggleUI {
      position: fixed; top: 10px; right: 10px; z-index: 1000;
      background: rgba(0,0,0,0.55); color: #fff; border: none;
      border-radius: 6px; padding: 8px 12px; font-size: 13px;
    }
    #startBtn {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      z-index: 1001; background: #2b7de9; color: #fff; border: none;
      padding: 16px 28px; font-size: 16px; border-radius: 10px;
    }
  </style>
</head>
<body>

  <button id="startBtn">Kamerayı Başlat</button>
  <button id="toggleUI">Ayarlar</button>

  <div class="ui-overlay" id="uiPanel">
    <div class="row"><label>X konum</label><input id="posX" type="range" min="-1" max="1" step="0.01" value="0"></div>
    <div class="row"><label>Y konum</label><input id="posY" type="range" min="-1" max="1" step="0.01" value="-0.05"></div>
    <div class="row"><label>Z konum</label><input id="posZ" type="range" min="-1" max="1" step="0.01" value="-0.05"></div>
    <div class="row"><label>Boyut</label><input id="scaleAll" type="range" min="0.1" max="3" step="0.01" value="1"></div>
    <div class="row"><label>Dönüş</label><input id="rotY" type="range" min="-180" max="180" step="1" value="0"></div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true, alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <video id="personVideo" src="./person.mp4" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video
        id="personPlane"
        src="#personVideo"
        chroma-key-material
        position="0 -0.05 -0.05"
        rotation="0 0 0"
        width="0.35"
        height="0.62"
      ></a-video>
    </a-entity>
  </a-scene>

  <script>
    // ---- Custom chroma-key shader ----
    AFRAME.registerShader('chromakey', {
      schema: {
        src: { type: 'map', is: 'uniform' },
        keyColor: { type: 'vec3', is: 'uniform', default: {x: 0.0, y: 1.0, z: 0.0} },
        similarity: { type: 'number', is: 'uniform', default: 0.4 },
        smoothness: { type: 'number', is: 'uniform', default: 0.08 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D src;
        uniform vec3 keyColor;
        uniform float similarity;
        uniform float smoothness;
        varying vec2 vUv;
        void main() {
          vec4 texColor = texture2D(src, vUv);
          float diff = distance(texColor.rgb, keyColor);
          float alpha = smoothstep(similarity, similarity + smoothness, diff);
          if (alpha < 0.05) discard;
          gl_FragColor = vec4(texColor.rgb, alpha);
        }
      `
    });

    AFRAME.registerComponent('chroma-key-material', {
      init: function () {
        this.el.setAttribute('material', {
          shader: 'chromakey',
          src: '#personVideo',
          transparent: true,
          side: 'double'
        });
      }
    });

    // ---- Start button: unlock video + camera ----
    const startBtn = document.getElementById('startBtn');
    const video = document.getElementById('personVideo');
    const sceneEl = document.querySelector('a-scene');

    startBtn.addEventListener('click', () => {
      video.muted = true;
      video.play().catch(()=>{});
      sceneEl.systems['mindar-image-system'].start();
      startBtn.style.display = 'none';
    });

    // ---- Adjustment UI ----
    const toggleUI = document.getElementById('toggleUI');
    const uiPanel = document.getElementById('uiPanel');
    toggleUI.addEventListener('click', () => uiPanel.classList.toggle('show'));

    const plane = document.getElementById('personPlane');
    const posX = document.getElementById('posX');
    const posY = document.getElementById('posY');
    const posZ = document.getElementById('posZ');
    const scaleAll = document.getElementById('scaleAll');
    const rotY = document.getElementById('rotY');

    function updateTransform() {
      plane.setAttribute('position', `${posX.value} ${posY.value} ${posZ.value}`);
      plane.setAttribute('scale', `${scaleAll.value} ${scaleAll.value} ${scaleAll.value}`);
      plane.setAttribute('rotation', `0 ${rotY.value} 0`);
    }
    [posX, posY, posZ, scaleAll, rotY].forEach(el => el.addEventListener('input', updateTransform));
  </script>
</body>
</html>
