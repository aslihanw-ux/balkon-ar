<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    // 1) Yeşil ekranı (chroma key) şeffaf yapan shader
    AFRAME.registerShader('chromakey', {
      schema: {
        src: {type: 'map', is: 'uniform'},
        color: {type: 'color', is: 'uniform', default: '#00FF00'},
        threshold: {type: 'number', is: 'uniform', default: 0.42},
        smoothing: {type: 'number', is: 'uniform', default: 0.08}
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D src;
        uniform vec3 color;
        uniform float threshold;
        uniform float smoothing;
        varying vec2 vUv;
        void main() {
          vec4 texColor = texture2D(src, vUv);
          float diff = length(texColor.rgb - color);
          float alpha = smoothstep(threshold, threshold + smoothing, diff);
          gl_FragColor = vec4(texColor.rgb, alpha);
        }
      `
    });

    // 2) Konum titremesini yumuşatan (lerp/slerp) bileşen
    AFRAME.registerComponent('smooth-anchor', {
      schema: {speed: {type: 'number', default: 0.18}},
      init: function () {
        this.lastPos = new THREE.Vector3();
        this.lastQuat = new THREE.Quaternion();
        this.ready = false;
      },
      tick: function () {
        const obj = this.el.object3D;
        if (!this.ready) {
          this.lastPos.copy(obj.position);
          this.lastQuat.copy(obj.quaternion);
          this.ready = true;
          return;
        }
        this.lastPos.lerp(obj.position, this.data.speed);
        this.lastQuat.slerp(obj.quaternion, this.data.speed);
        obj.position.copy(this.lastPos);
        obj.quaternion.copy(this.lastQuat);
      }
    });

    // 3) Hedef kaybolduğunda figürü hemen gizlemek yerine
    //    bir süre son bilinen konumda tutan bileşen (belirip-kaybolmayı azaltır)
    AFRAME.registerComponent('persist-visibility', {
      schema: {holdFrames: {type: 'number', default: 30}},
      init: function () {
        this.hiddenCounter = 0;
        this.targetEl = this.el;
      },
      tick: function () {
        const visible = this.el.object3D.visible;
        if (!visible) {
          this.hiddenCounter++;
          if (this.hiddenCounter < this.data.holdFrames) {
            this.el.object3D.visible = true;
          }
        } else {
          this.hiddenCounter = 0;
        }
      }
    });
  </script>
</head>
<body style="margin:0; overflow:hidden;">

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;
                  filterMinCF:0.00001;
                  filterBeta: 1;
                  missTolerance:20;
                  warmupTolerance:3;
                  uiScanning: no;
                  uiLoading: no;
                  uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-assets>
      <video id="personVideo" src="./person.mp4" autoplay loop muted playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false"></a-camera>

    <a-entity
      mindar-image-target="targetIndex: 0"
      smooth-anchor="speed: 0.18"
      persist-visibility="holdFrames: 30"
    >
      <!-- Figür: kapının yanında, yeşil ekran temizlenmiş -->
      <a-plane
        material="shader: chromakey; src: #personVideo; transparent: true; side: double; threshold: 0.42; smoothing: 0.08"
        position="0.15 0.25 0"
        rotation="0 0 0"
        width="0.45"
        height="0.65"
      ></a-plane>
    </a-entity>

  </a-scene>

</body>
</html>
